name: Create Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Read version from package.json
        id: package_version
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
          
          # Check if version contains beta, alpha, rc, or pre
          if [[ "$VERSION" =~ (beta|alpha|rc|pre) ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "This is a pre-release version"
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "This is a stable release"
          fi
      
      - name: Create release archive
        run: |
          # Create zip excluding .github directory
          zip -r "valenvrc.whitelistedtp-v${{ steps.package_version.outputs.version }}.zip" . -x ".github/*" ".git/*"
          
          echo "Archive created: valenvrc.whitelistedtp-v${{ steps.package_version.outputs.version }}.zip"
      
      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "v${{ steps.package_version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Get previous tag
        id: previous_tag
        run: |
          # Get the latest tag
          PREVIOUS_TAG=$(git tag --sort=-creatordate | head -n 1)
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "tag=" >> $GITHUB_OUTPUT
            echo "No previous tag found"
          else
            echo "tag=$PREVIOUS_TAG" >> $GITHUB_OUTPUT
            echo "Previous tag: $PREVIOUS_TAG"
          fi
      
      - name: Generate changelog
        id: changelog
        run: |
          if [ -z "${{ steps.previous_tag.outputs.tag }}" ]; then
            # No previous tag, get all commits
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            # Get commits since previous tag
            CHANGELOG=$(git log ${{ steps.previous_tag.outputs.tag }}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi
          
          # Save changelog to output using heredoc to handle multiline
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          echo "Generated changelog:"
          echo "$CHANGELOG"
      
      - name: Create Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.package_version.outputs.version }}
          name: valenvrc.WhitelistedTP v${{ steps.package_version.outputs.version }}
          draft: false
          prerelease: ${{ steps.package_version.outputs.prerelease }}
          files: valenvrc.whitelistedtp-v${{ steps.package_version.outputs.version }}.zip
          body: |
            ## valenvrc.WhitelistedTP v${{ steps.package_version.outputs.version }}
            
            ### Changes
            ${{ steps.changelog.outputs.changelog }}
            
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Tag already exists
        if: steps.check_tag.outputs.exists == 'true'
        run: |
          echo "⚠️ Tag v${{ steps.package_version.outputs.version }} already exists. Skipping release creation."
          echo "To create a new release, update the version in package.json"
